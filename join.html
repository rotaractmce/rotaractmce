<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join the Rotaract Club of MCE - Register to become a member.">
    <title>Join - Rotaract Club MCE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="form-page">
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="nav-logo nav-logo-rotaract">
                <img src="images/Rotaract.png" alt="Rotaract Club Logo">
            </a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="aboutus.html">About</a>
                <a href="events.html">Events</a>
                <a href="gallery.html">Gallery</a>
                <a href="sponsors.html">Sponsors</a>
                <a href="contact.html">Contact</a>
            </nav>
            <a href="index.html" class="nav-logo nav-logo-mce">
                <img src="images/Mce logo.png" alt="Malnad College of Engineering Logo">
            </a>
            <button class="menu-toggle" aria-label="Toggle navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        <div class="nav-overlay"></div>
    </header>

    <section class="page-hero">
        <h1>Registration Form</h1>
    </section>

    <main class="main-content">
        <div class="form-container fade-in">
            <form action="#">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter Your Full Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter Your Email Address" required>
                    </div>
                    <div class="form-group">
                        <label for="contact">Contact Number</label>
                        <input type="tel" id="contact" placeholder="Enter Your Contact Number" required>
                    </div>
                    <div class="form-group">
                        <label for="stream">Stream</label>
                        <input type="text" id="stream" placeholder="Enter Your Stream Name" required>
                    </div>
                    <div class="form-group">
                        <label for="current-year">Current Year</label>
                        <input type="number" id="current-year" placeholder="Enter Your Current Year" required>
                    </div>
                    <div class="form-group">
                        <label for="passing-year">Passing Year</label>
                        <input type="number" id="passing-year" placeholder="Enter Your Passing Year" required>
                    </div>
                    <div class="form-group">
                        <label for="expertise">Field of Expertise</label>
                        <input type="text" id="expertise" placeholder="Enter your Field of Expertise" required>
                    </div>
                    <div class="form-group">
                        <label for="why-join">Why you want to Join Community?</label>
                        <input type="text" id="why-join" placeholder="Your Response" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="experience">How much experience do you have working in a community?</label>
                        <input type="text" id="experience" placeholder="Your experience" required>
                    </div>
                </div>

                <div class="department-section">
                    <h3>In which Department do you want to Work?</h3>
                    <div class="department-options">
                        <label class="department-option">
                            <input type="radio" name="department" value="anchoring">
                            <span>Anchoring</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="content-writing">
                            <span>Content Writing</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="event-management">
                            <span>Event Management and Coordination</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="graphic-design">
                            <span>Graphic Designing and Video Editing</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="marketing">
                            <span>Marketing and Sponsorship</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="hr">
                            <span>Human Resources Management</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="pr">
                            <span>Public Relations Management</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="web-dev">
                            <span>Web Development</span>
                        </label>
                        <label class="department-option">
                            <input type="radio" name="department" value="dsa">
                            <span>DSA speakers and Coordinators</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="form-submit">Register</button>
            </form>
            <div class="instagram-follow">
                <p>Follow us on Instagram: <a href="https://www.instagram.com/rotaract_clubmce_?igsh=MWc1anpzYmNqeGx2Nw==" target="_blank" rel="noopener noreferrer">@rotaract_clubmce_</a></p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-bottom">
                <span>Copyright &copy; Rotaract Club. All Rights Reserved</span>
                <span>|</span>
                <a href="mailto:rotaractclub.mce91@gmail.com">rotaractclub.mce91@gmail.com</a>
            </div>
            <p class="footer-credit">Developed by Rtr. Kiran B K (2024 Passed Out Batch)</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
